name: tests

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        # 3.14: what Streamlit Community Cloud runs; 3.12: the documented minimum for local use.
        python-version: ["3.12", "3.14"]
    name: tests (Python ${{ matrix.python-version }})
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Build the database offline (from data/processed, no network)
        run: python -m data.etl --offline

      - name: Run tests (offline, fake LLMs, no API keys)
        run: python -m pytest -q
